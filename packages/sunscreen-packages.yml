notes: >-
  Sunscreen ships two package families. The Rust "sunscreen" crate family on
  crates.io is the open-source FHE/ZKP compiler + runtime. The "parasol" crates
  are the Parasol FHE processor runtime/CPU. @sunscreen/spf-client on npm is the
  TypeScript SDK for the Sunscreen SPF (Secure Processing Framework) testnet REST
  service; the same repo also ships the Rust `spf-client` CLI binary (see cli/).
